version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadesreality-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hadesuser
      POSTGRES_PASSWORD: hadespassword
      POSTGRES_DB: hadesreality_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadesuser -d hadesreality_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hadesreality-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=hadesreality_db
      - DB_POSTGRESDB_USER=hadesuser
      - DB_POSTGRESDB_PASSWORD=hadespassword
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
