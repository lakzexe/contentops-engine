version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadesreality-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hadesuser
      POSTGRES_PASSWORD: hadespassword
      POSTGRES_DB: hadesreality_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadesuser -d hadesreality_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hadesreality-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
